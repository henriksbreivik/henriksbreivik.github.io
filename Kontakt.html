<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henrik — Kontakt</title>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      if (stored === 'light' || stored === 'dark' || stored === '90s') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="logo">&lt;Henrik<span class="accent"> /</span>&gt;</a>
      <ul class="nav-links">
        <li><a href="index.html">Hjem</a></li>
        <li><a href="Cv.html">CV</a></li>
        <li><a href="Prosjekter.html">Prosjekter</a></li>
        <li><a href="Kontakt.html" class="active">Kontakt</a></li>
      </ul>
      <select id="theme-toggle" class="theme-toggle" aria-label="Velg tema">
        <option value="standard">🖥️ Standard</option>
        <option value="light">☀️ Lys</option>
        <option value="dark">🌙 Mørk</option>
        <option value="90s">💾 90s</option>
      </select>
    </nav>
  </header>

  <main>
    <div class="page-body">
      <h1 aria-label="Kontakt"><span class="typed-text" aria-hidden="true">Kontakt</span><span class="cursor accent" aria-hidden="true">_</span></h1>
      <p>
        Kontaktinformasjon kommer snart her.
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="mono">Henrik &copy; 2026</span>
      <span class="mono dim">Bygget med HTML, CSS og 100% vibe-coding ¯\_(ツ)_/¯</span>
    </div>
  </footer>

  <script src="theme.js" defer></script>
  <script src="typewriter.js" defer></script>
</body>
</html>
